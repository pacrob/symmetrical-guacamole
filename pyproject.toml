[project]
name = "email-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pacrob", email = "5199899+pacrob@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.2",
    "langchain-anthropic>=1.4.4",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.2",
    "pydantic>=2.13.4",
]

[project.scripts]
email-classifier = "email_classifier:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
